<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="400" viewBox="0 0 360 400" role="img" aria-label="Yang, ENGENHARIA">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#8ab4ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8ab4ff"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect x="2" y="2" width="356" height="396" rx="24"/></clipPath>
  <clipPath id="av"><circle cx="180" cy="142" r="62"/></clipPath>
</defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite;opacity:.15}
  @keyframes tw{0%,100%{opacity:.08}50%{opacity:.9}}
  .border{stroke-dasharray:140 900;animation:dash 5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-2080}}
  .spin{transform-origin:180px 142px;animation:spin 6s linear infinite}
  .spin2{transform-origin:180px 142px;animation:spin 11s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .float{animation:fl 4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .pulse{transform-origin:180px 142px;animation:pu 3s ease-in-out infinite}
  @keyframes pu{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.12);opacity:1}}
  .sweep{animation:sw 6s ease-in-out infinite}
  @keyframes sw{0%{transform:translateX(-420px)}60%,100%{transform:translateX(420px)}}
  .up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .mark{transform-origin:300px 340px;animation:mk 14s ease-in-out infinite}
  @keyframes mk{0%,100%{opacity:.05;transform:rotate(-6deg)}50%{opacity:.14;transform:rotate(6deg)}}
  .badge{animation:bg 3.2s ease-in-out infinite}
  @keyframes bg{0%,100%{opacity:.85}50%{opacity:1}}
  .dot{animation:dt 1.6s ease-in-out infinite}
  @keyframes dt{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<rect x="2" y="2" width="356" height="396" rx="24" fill="#0a0a0c"/>
<g clip-path="url(#card)">
  <rect width="360" height="400" fill="url(#glow)" opacity=".35"/>
  <circle cx="82" cy="305" r="1" fill="#fff" class="tw" style="animation-delay:1.02s;animation-duration:3.34s"/><circle cx="244" cy="255" r="1.6" fill="#fff" class="tw" style="animation-delay:1.52s;animation-duration:2.68s"/><circle cx="263" cy="28" r="1.2" fill="#fff" class="tw" style="animation-delay:1.73s;animation-duration:3.95s"/><circle cx="15" cy="370" r="1.2" fill="#fff" class="tw" style="animation-delay:1.07s;animation-duration:4.04s"/><circle cx="316" cy="66" r="1.2" fill="#fff" class="tw" style="animation-delay:0.12s;animation-duration:2.26s"/><circle cx="291" cy="18" r="1.2" fill="#fff" class="tw" style="animation-delay:2.75s;animation-duration:4.43s"/><circle cx="28" cy="284" r="1" fill="#fff" class="tw" style="animation-delay:3.05s;animation-duration:4.36s"/><circle cx="297" cy="133" r="1.2" fill="#fff" class="tw" style="animation-delay:0.92s;animation-duration:2.70s"/><circle cx="249" cy="162" r="1" fill="#fff" class="tw" style="animation-delay:1.66s;animation-duration:4.31s"/><circle cx="342" cy="65" r="1" fill="#fff" class="tw" style="animation-delay:2.52s;animation-duration:3.86s"/><circle cx="165" cy="75" r="1.6" fill="#fff" class="tw" style="animation-delay:1.33s;animation-duration:3.86s"/><circle cx="270" cy="230" r="1.6" fill="#fff" class="tw" style="animation-delay:3.32s;animation-duration:3.74s"/><circle cx="169" cy="159" r="1.6" fill="#fff" class="tw" style="animation-delay:3.89s;animation-duration:3.35s"/><circle cx="272" cy="215" r="1.6" fill="#fff" class="tw" style="animation-delay:3.41s;animation-duration:3.30s"/><circle cx="220" cy="226" r="1.6" fill="#fff" class="tw" style="animation-delay:0.69s;animation-duration:3.46s"/><circle cx="205" cy="58" r="1.2" fill="#fff" class="tw" style="animation-delay:2.66s;animation-duration:2.45s"/><circle cx="97" cy="280" r="1.2" fill="#fff" class="tw" style="animation-delay:1.48s;animation-duration:3.89s"/><circle cx="254" cy="36" r="1.2" fill="#fff" class="tw" style="animation-delay:2.81s;animation-duration:4.46s"/><circle cx="317" cy="310" r="1.2" fill="#fff" class="tw" style="animation-delay:2.59s;animation-duration:2.59s"/><circle cx="130" cy="20" r="1" fill="#fff" class="tw" style="animation-delay:2.16s;animation-duration:4.18s"/><circle cx="132" cy="221" r="1.6" fill="#fff" class="tw" style="animation-delay:1.38s;animation-duration:4.15s"/><circle cx="194" cy="249" r="1.2" fill="#fff" class="tw" style="animation-delay:2.64s;animation-duration:3.60s"/><circle cx="16" cy="210" r="1.6" fill="#fff" class="tw" style="animation-delay:2.05s;animation-duration:2.50s"/><circle cx="301" cy="119" r="1.2" fill="#fff" class="tw" style="animation-delay:3.80s;animation-duration:3.31s"/><circle cx="200" cy="305" r="1.6" fill="#fff" class="tw" style="animation-delay:0.80s;animation-duration:3.36s"/><circle cx="262" cy="196" r="1.2" fill="#fff" class="tw" style="animation-delay:1.38s;animation-duration:3.44s"/>
  <text class="mark" x="300" y="372" font-size="150" text-anchor="middle" fill="#fff" font-family="'Noto Sans JP','Yu Gothic',sans-serif">真</text>
  <g class="sweep"><rect x="0" y="0" width="140" height="400" fill="url(#shine)" transform="skewX(-18)"/></g>
</g>
<rect x="2" y="2" width="356" height="396" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
<rect class="border" x="2" y="2" width="356" height="396" rx="24" fill="none" stroke="url(#bd)" stroke-width="2.5" stroke-linecap="round" pathLength="1000"/>
<circle class="pulse" cx="180" cy="142" r="92" fill="url(#glow)"/>
<g class="float">
  <circle class="spin" cx="180" cy="142" r="78" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="90 400" stroke-linecap="round"/>
  <circle class="spin2" cx="180" cy="142" r="72" fill="none" stroke="#8ab4ff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="180" cy="142" r="64" fill="#000"/>
  <image xlink:href="data:image/jpeg;base64," x="118" y="80" width="124" height="124" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="180" cy="142" r="62" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
</g>
<g class="up" style="animation-delay:.25s"><text x="180" y="262" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff" letter-spacing="1">Yang</text></g>
<g class="up" style="animation-delay:.45s"><text x="180" y="290" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#9a9aa5">@yanghyperx</text></g>
<g class="up" style="animation-delay:.65s"><g class="badge">
  <rect x="60" y="314" width="240" height="38" rx="19" fill="url(#ring)"/>
  <circle cx="84" cy="333" r="4" fill="#0a0a0c" class="dot"/>
  <text x="190" y="338.5" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2.2" fill="#0a0a0c">ENGENHARIA</text>
</g></g>
</svg>